<style id="tokens">
/* Observatory design tokens — the single source of truth for colour.
   Never hard-code a hex in app CSS, components, or chart configs:
   read these via var(--obs-*) or getComputedStyle. */

:root {
  --obs-primary: #1a4d8f;
  --obs-primary-dark: #123a6d;
  --obs-ink: #0f172a;
  --obs-text: #334155;
  --obs-text-muted: #64748b;
  /* one step quieter than muted — footnotes that sit under a block they
     annotate, where muted would compete with the block's own labels */
  --obs-text-faint: #94a3b8;
  --obs-border: #e2e8f0;
  --obs-grid: #eef2f7;
  --obs-surface: #ffffff;
  --obs-surface-subtle: #f8fafc;

  /* site header — a filled navy bar, so its foregrounds are "on-primary"
     values that cannot be derived from the body text tokens. Same navy as the
     section band: one platform blue, not two. */
  --obs-header-bg: #1a4d8f;
  --obs-header-ink: #ffffff;
  --obs-header-text: #c5d7ec;
  --obs-header-muted: #aec6e1;
  --obs-header-accent: #8fbde8;
  --obs-header-border: rgba(255, 255, 255, 0.28);
  --obs-header-focus: rgba(255, 255, 255, 0.75);

  /* section header band — same fill as the site header */
  --obs-band-bg: #1a4d8f;
  --obs-band-ink: #ffffff;
  --obs-band-muted: #c5d7ec;

  /* categorical series palette — assigned by stable series identity */
  --obs-series-1: #1a4d8f;
  --obs-series-2: #c2410c;
  --obs-series-3: #0f766e;
  --obs-series-4: #a16207;
  --obs-series-5: #475569;
  --obs-series-6: #9d174d;

  /* diverging scale (cool = negative, warm = positive) */
  --obs-diverge-neg: #1a4d8f;
  --obs-diverge-neg-soft: #7ba7d4;
  --obs-diverge-mid: #f1f5f9;
  --obs-diverge-pos-soft: #e8a87c;
  --obs-diverge-pos: #c2410c;

  /* trust labels — outline-only badges */
  --obs-trust-official: #15803d;
  --obs-trust-model: #b45309;
  --obs-trust-stale: #b91c1c;

  /* A filing whose own figures contradict each other. Deliberately NOT a trust
     colour: it marks a problem in the source document, not the standing of a
     number we publish. */
  --obs-warn: #c2410c;

  --obs-focus: rgba(26, 77, 143, 0.35);
  --obs-focus-soft: rgba(26, 77, 143, 0.15);
}

[data-theme="dark"] {
  --obs-primary: #5b9bd8;
  --obs-primary-dark: #7fb3e3;
  --obs-ink: #e2e8f0;
  --obs-text: #cbd5e1;
  --obs-text-muted: #94a3b8;
  --obs-text-faint: #7c8ba3;
  --obs-border: #2b3a52;
  --obs-grid: #22304a;
  --obs-surface: #0f172a;
  --obs-surface-subtle: #1a2436;

  --obs-header-bg: #16406f;
  --obs-header-ink: #f1f5f9;
  --obs-header-text: #aac3de;
  --obs-header-muted: #a9c2dd;
  --obs-header-accent: #7fb3e3;
  --obs-header-border: rgba(255, 255, 255, 0.16);
  --obs-header-focus: rgba(255, 255, 255, 0.7);

  --obs-band-bg: #16406f;
  --obs-band-ink: #f1f5f9;
  --obs-band-muted: #a9c2dd;

  --obs-series-1: #5b9bd8;
  --obs-series-2: #e0794a;
  --obs-series-3: #3fb3a2;
  --obs-series-4: #cfa348;
  --obs-series-5: #94a3b8;
  --obs-series-6: #d1648f;

  --obs-diverge-neg: #5b9bd8;
  --obs-diverge-neg-soft: #3d6ea6;
  --obs-diverge-mid: #1a2436;
  --obs-diverge-pos-soft: #a65c33;
  --obs-diverge-pos: #e0794a;

  --obs-trust-official: #55b785;
  --obs-trust-model: #daa353;
  --obs-trust-stale: #e26d6d;
  --obs-warn: #e0794a;

  --obs-focus: rgba(91, 155, 216, 0.45);
  --obs-focus-soft: rgba(91, 155, 216, 0.2);
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --obs-primary: #5b9bd8;
    --obs-primary-dark: #7fb3e3;
    --obs-ink: #e2e8f0;
    --obs-text: #cbd5e1;
    --obs-text-muted: #94a3b8;
    --obs-text-faint: #7c8ba3;
    --obs-border: #2b3a52;
    --obs-grid: #22304a;
    --obs-surface: #0f172a;
    --obs-surface-subtle: #1a2436;

    --obs-header-bg: #16406f;
    --obs-header-ink: #f1f5f9;
    --obs-header-text: #aac3de;
    --obs-header-muted: #a9c2dd;
    --obs-header-accent: #7fb3e3;
    --obs-header-border: rgba(255, 255, 255, 0.16);
    --obs-header-focus: rgba(255, 255, 255, 0.7);

    --obs-band-bg: #16406f;
    --obs-band-ink: #f1f5f9;
    --obs-band-muted: #a9c2dd;

    --obs-series-1: #5b9bd8;
    --obs-series-2: #e0794a;
    --obs-series-3: #3fb3a2;
    --obs-series-4: #cfa348;
    --obs-series-5: #94a3b8;
    --obs-series-6: #d1648f;

    --obs-diverge-neg: #5b9bd8;
    --obs-diverge-neg-soft: #3d6ea6;
    --obs-diverge-mid: #1a2436;
    --obs-diverge-pos-soft: #a65c33;
    --obs-diverge-pos: #e0794a;

    --obs-trust-official: #55b785;
    --obs-trust-model: #daa353;
    --obs-trust-stale: #e26d6d;
    --obs-warn: #e0794a;

    --obs-focus: rgba(91, 155, 216, 0.45);
    --obs-focus-soft: rgba(91, 155, 216, 0.2);
  }
}

</style>
<style>
/* Investment Assistant prototype.
   Colours come only from the --obs-* tokens (observatory/web/assets/tokens.css,
   inlined at build time). Spacing scale: 4 · 8 · 12 · 16 · 20 · 24 · 32 · 48. */

* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 14px; }
body {
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
    "Helvetica Neue", Arial, "Hiragino Sans", "Yu Gothic", sans-serif;
  background: var(--obs-surface);
  color: var(--obs-text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  height: 100vh;
  overflow: hidden;
}
a { color: var(--obs-primary); text-decoration: none; }
a:hover { text-decoration: underline; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: none; box-shadow: 0 0 0 2px var(--obs-focus); border-radius: 4px; }
svg { stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; flex-shrink: 0; }
code, .mono { font-family: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, monospace; font-size: 12px; }
.hidden { display: none !important; }
.muted { color: var(--obs-text-muted); }
.small { font-size: 12.5px; }
.ok { color: var(--obs-trust-official); }
.grow { flex: 1; }
time { font-variant-numeric: tabular-nums; }

/* ---------------------------------------------------------------- shell */
.shell { display: grid; grid-template-columns: 232px minmax(0, 1fr); height: 100vh; }

.nav {
  background: var(--obs-surface-subtle);
  border-right: 1px solid var(--obs-border);
  display: flex; flex-direction: column;
  padding: 16px 12px;
  overflow-y: auto;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 8px 24px; }
.logo {
  width: 28px; height: 28px; border: 1.5px solid var(--obs-primary); border-radius: 4px;
  display: grid; place-items: center; color: var(--obs-primary); font-weight: 700; font-size: 11px;
}
.brand b { display: block; color: var(--obs-ink); font-weight: 600; line-height: 1.25; }
.brand small { color: var(--obs-text-muted); font-size: 12px; }

.navlist { display: flex; flex-direction: column; gap: 2px; }
.navitem {
  display: flex; align-items: center; gap: 10px; width: 100%; height: 34px; padding: 0 8px;
  border-radius: 4px; text-align: left; color: var(--obs-text);
}
.navitem svg { width: 16px; height: 16px; color: var(--obs-text-muted); }
.navitem > span:not(.mini) { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.navitem:hover { background: var(--obs-grid); }
.navitem.on { background: var(--obs-focus-soft); color: var(--obs-primary); font-weight: 600; }
.navitem.on svg { color: var(--obs-primary); }
.navitem .count {
  font-style: normal; font-size: 11px; font-weight: 600; color: var(--obs-series-2);
  border: 1px solid currentColor; border-radius: 9px; padding: 0 6px; line-height: 16px;
}
.navitem .mini {
  width: 20px; height: 20px; border: 1px solid var(--obs-border); border-radius: 4px; background: var(--obs-surface);
  display: grid; place-items: center; font-size: 9px; font-weight: 700; color: var(--obs-primary); flex-shrink: 0;
}
.navitem.add { color: var(--obs-text-muted); }
.navsec { font-size: 12px; color: var(--obs-text-muted); padding: 28px 8px 8px; }
.navfoot {
  margin-top: auto; display: flex; align-items: center; gap: 10px;
  padding: 16px 8px 0; border-top: 1px solid var(--obs-border); font-size: 13px;
}
.navfoot > span:nth-child(2) { flex: 1; }
.navfoot button { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 4px; color: var(--obs-text-muted); }
.navfoot button:hover { background: var(--obs-grid); color: var(--obs-ink); }
.navfoot svg { width: 16px; height: 16px; }

.main { display: flex; flex-direction: column; min-width: 0; height: 100vh; }
.topbar {
  height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 12px;
  padding: 0 40px; border-bottom: 1px solid var(--obs-border);
}
.crumbs { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--obs-text-muted); min-width: 0; white-space: nowrap; overflow: hidden; }
.crumbs a { color: var(--obs-text-muted); }
.crumbs b { color: var(--obs-ink); font-weight: 500; overflow: hidden; text-overflow: ellipsis; }
.crumbs .sep { color: var(--obs-text-faint); }
.searchbtn {
  display: flex; align-items: center; gap: 8px; width: 220px; height: 32px; padding: 0 10px;
  border: 1px solid var(--obs-border); border-radius: 4px; color: var(--obs-text-muted); font-size: 13px;
}
.searchbtn:hover { border-color: var(--obs-text-faint); }
.searchbtn svg { width: 14px; height: 14px; }
.searchbtn kbd { margin-left: auto; font-family: inherit; font-size: 11px; color: var(--obs-text-faint); }

.content { flex: 1; overflow-y: auto; }
.page { max-width: 1080px; margin: 0 auto; padding: 32px 40px 80px; }
.page.wide { max-width: 1240px; }
.page.narrow { max-width: 800px; }
.page.fit { padding-bottom: 24px; }

.pagehead { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 32px; }
.pagehead > div:first-of-type { flex: 1; min-width: 0; }
.pagehead h1 { font-size: 22px; line-height: 1.3; font-weight: 600; color: var(--obs-ink); letter-spacing: -.015em; }
.pagehead p { color: var(--obs-text-muted); margin-top: 4px; }
.pagehead .actions { display: flex; gap: 8px; flex-shrink: 0; }
.pagehead.sp { align-items: center; }

h3.sec { font-size: 13px; font-weight: 600; color: var(--obs-ink); margin: 40px 0 12px; display: flex; align-items: baseline; gap: 8px; }
h3.sec:first-child { margin-top: 0; }

/* ----------------------------------------------------------- primitives */
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
  border: 1px solid var(--obs-border); border-radius: 4px; background: var(--obs-surface);
  color: var(--obs-ink); font-size: 13px; font-weight: 500; white-space: nowrap;
}
.btn:hover { border-color: var(--obs-text-faint); }
.btn.primary { background: var(--obs-primary); border-color: var(--obs-primary); color: #fff; }
.btn.primary:hover { background: var(--obs-primary-dark); border-color: var(--obs-primary-dark); }
.btn.sm { height: 28px; padding: 0 10px; font-size: 12.5px; }
.btn svg { width: 14px; height: 14px; }
.linkbtn { display: inline-flex; align-items: center; gap: 4px; color: var(--obs-primary); font-size: 12.5px; }
.linkbtn:hover { text-decoration: underline; }
.linkbtn svg { width: 13px; height: 13px; }
.linkbtn.warn { color: var(--obs-series-2); }

.badge {
  display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase;
  border: 1px solid currentColor; border-radius: 3px; padding: 0 5px; line-height: 17px; color: var(--obs-text-muted);
}
.badge.official { color: var(--obs-trust-official); }

.av {
  width: 32px; height: 32px; border: 1px solid var(--obs-border); border-radius: 4px; background: var(--obs-surface-subtle);
  display: grid; place-items: center; flex-shrink: 0; font-size: 11px; font-weight: 700; color: var(--obs-primary);
}
.av.sm { width: 26px; height: 26px; font-size: 10px; }
.av.lg { width: 48px; height: 48px; font-size: 15px; }
.av.me { border-radius: 50%; background: var(--obs-ink); border-color: var(--obs-ink); color: var(--obs-surface); }

.panel { border: 1px solid var(--obs-border); border-radius: 4px; background: var(--obs-surface); }
.panel > header {
  display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--obs-border);
  font-size: 13px; font-weight: 600; color: var(--obs-ink);
}
.panel > header small { font-weight: 400; color: var(--obs-text-muted); }
.panel .body { padding: 16px; }
.empty { padding: 16px; color: var(--obs-text-muted); font-size: 13px; }

.rows { list-style: none; border: 1px solid var(--obs-border); border-radius: 4px; }
.rows > li { display: flex; align-items: center; gap: 14px; padding: 14px 16px; border-bottom: 1px solid var(--obs-grid); }
.rows > li:last-child { border-bottom: 0; }
.rows > li > div { flex: 1; min-width: 0; }
.rows b { display: block; font-weight: 500; color: var(--obs-ink); }
.rows small { display: block; color: var(--obs-text-muted); font-size: 12.5px; margin-top: 1px; }
.rows code { color: var(--obs-primary); }
.rows li[data-go] { cursor: pointer; }
.rows li[data-go]:hover { background: var(--obs-surface-subtle); }

.linklist { list-style: none; padding: 6px 0; }
.linklist button { display: block; width: 100%; text-align: left; padding: 8px 16px; }
.linklist button:hover { background: var(--obs-surface-subtle); }
.linklist b { display: block; font-weight: 500; color: var(--obs-ink); font-size: 13.5px; }
.linklist small { color: var(--obs-text-muted); font-size: 12px; }
.linklist.mono button { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 12px; color: var(--obs-text); padding: 6px 16px; }

.kvlist { list-style: none; padding: 4px 0; }
.kvlist li { display: flex; justify-content: space-between; gap: 12px; padding: 8px 16px; font-size: 13px; }
.kvlist li span { color: var(--obs-text-muted); }
.kvlist li b { font-weight: 500; color: var(--obs-ink); display: inline-flex; align-items: center; gap: 4px; }
.kvlist li b.ok { color: var(--obs-trust-official); }
.kvlist svg { width: 13px; height: 13px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  height: 32px; padding: 0 12px; border: 1px solid var(--obs-border); border-radius: 4px;
  font-size: 13px; color: var(--obs-ink); background: var(--obs-surface);
}
.chip:hover { border-color: var(--obs-primary); color: var(--obs-primary); }

.fine { font-size: 12px; color: var(--obs-text-faint); line-height: 1.6; }

table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th {
  text-align: left; font-size: 12px; font-weight: 500; color: var(--obs-text-muted);
  padding: 8px 12px; border-bottom: 1px solid var(--obs-border); white-space: nowrap;
}
table.t td { padding: 10px 12px; border-bottom: 1px solid var(--obs-grid); vertical-align: top; }
table.t tbody tr:last-child td { border-bottom: 0; }
table.t th.right, table.t td.right { text-align: right; font-variant-numeric: tabular-nums; }
table.t td.nowrap { white-space: nowrap; }
table.t td small { display: block; color: var(--obs-text-muted); font-size: 12px; }
table.t .code { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--obs-primary); }
table.t td.reason { color: var(--obs-text-muted); font-size: 12.5px; }
.tw { overflow-x: auto; margin: 12px 0; }

/* provenance line, formula and tool trail under any answer */
.prov { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; margin-top: 10px; font-size: 12px; color: var(--obs-text-muted); }
.reveal { margin-top: 8px; padding: 8px 12px; background: var(--obs-surface-subtle); border-radius: 4px; font-size: 12px; color: var(--obs-text); }
.trail { margin-top: 8px; border: 1px solid var(--obs-border); border-radius: 4px; font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 11.5px; }
.trail div { display: flex; gap: 10px; padding: 6px 10px; border-bottom: 1px solid var(--obs-grid); }
.trail div:last-child { border-bottom: 0; }
.trail .n, .trail .ms { color: var(--obs-text-faint); }
.trail .fn { color: var(--obs-primary); }
.trail .args { flex: 1; min-width: 0; color: var(--obs-text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ----------------------------------------------------------------- desk */
.desk { display: grid; grid-template-columns: minmax(0, 1fr) 420px; gap: 40px; align-items: start; }

.tree .root { display: flex; align-items: center; gap: 12px; }
.tree .root b { display: block; font-weight: 600; color: var(--obs-ink); }
.tree .root small { color: var(--obs-text-muted); font-size: 12.5px; }
.tree ul { list-style: none; margin-left: 16px; padding-top: 16px; border-left: 1px solid var(--obs-border); }
.tree li { position: relative; padding: 0 0 12px 24px; }
.tree li:last-child { padding-bottom: 0; }
.tree li::before { content: ""; position: absolute; left: 0; top: 36px; width: 24px; height: 1px; background: var(--obs-border); }
.tree li:last-child::after { content: ""; position: absolute; left: -1px; top: 37px; bottom: 0; width: 1px; background: var(--obs-surface); }
.node {
  display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
  padding: 16px; border: 1px solid var(--obs-border); border-radius: 4px; background: var(--obs-surface);
}
.node:hover { border-color: var(--obs-primary); }
.node .who { flex: 1; min-width: 0; }
.node .who b { display: block; font-weight: 600; color: var(--obs-ink); }
.node .who small { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 11.5px; color: var(--obs-text-muted); }
.node .st { text-align: right; font-size: 13px; }
.node .st span { display: flex; align-items: center; justify-content: flex-end; gap: 6px; color: var(--obs-text); }
.node .st small { display: block; color: var(--obs-text-muted); font-size: 12px; margin-top: 2px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--obs-trust-official); flex-shrink: 0; }
.dot.wait { background: var(--obs-series-2); }
.dot.idle { background: var(--obs-text-faint); }
.tree .addrow { margin: 20px 0 0 40px; }

.feed {
  border: 1px solid var(--obs-border); border-radius: 4px; display: flex; flex-direction: column;
  height: calc(100vh - 56px - 32px - 94px - 40px); min-height: 440px;
}
.feedhead { display: flex; align-items: baseline; gap: 10px; padding: 14px 20px; border-bottom: 1px solid var(--obs-border); }
.feedhead b { font-weight: 600; color: var(--obs-ink); }
.feedhead span { color: var(--obs-text-muted); font-size: 12.5px; }
.posts { flex: 1; overflow-y: auto; }
.post { display: flex; gap: 12px; padding: 20px; border-bottom: 1px solid var(--obs-grid); }
.post:last-child { border-bottom: 0; }
.pbody { flex: 1; min-width: 0; }
.pbody > header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
.pbody > header b { font-weight: 600; color: var(--obs-ink); font-size: 13.5px; }
.pbody > header time { color: var(--obs-text-faint); font-size: 12px; }
.ptext, .pbody > p { line-height: 1.6; }
.ptext b, .txt b { color: var(--obs-ink); font-weight: 600; font-variant-numeric: tabular-nums; }
.ptext p + p { margin-top: 8px; }
.reply { color: var(--obs-text-muted); font-size: 12.5px; margin-top: 4px; }
.approval {
  display: flex; align-items: center; gap: 8px; margin-top: 14px; padding: 10px 12px;
  border: 1px solid var(--obs-border); border-left: 2px solid var(--obs-series-2); border-radius: 4px;
}
.approval span { flex: 1; font-size: 13px; }
.done { display: flex; align-items: center; gap: 6px; margin-top: 12px; font-size: 12.5px; }
.done svg { width: 13px; height: 13px; }
.sysline { padding: 12px 20px; text-align: center; font-size: 12px; color: var(--obs-text-muted); border-bottom: 1px solid var(--obs-grid); }
.compose { position: relative; display: flex; align-items: center; gap: 8px; padding: 12px; border-top: 1px solid var(--obs-border); }
.compose textarea {
  flex: 1; height: 32px; resize: none; overflow: hidden; padding: 6px 12px; line-height: 1.4; font-size: 13.5px;
  border: 1px solid var(--obs-border); border-radius: 4px; background: var(--obs-surface);
}
.mentions { position: absolute; left: 12px; bottom: 56px; min-width: 240px; border: 1px solid var(--obs-border); border-radius: 4px; background: var(--obs-surface); padding: 4px 0; z-index: 30; }
.mentions button { display: block; width: 100%; text-align: left; padding: 6px 12px; font-size: 13px; }
.mentions button:hover { background: var(--obs-surface-subtle); }

/* ----------------------------------------------------------- catalogue */
.toolbar { display: flex; align-items: center; gap: 16px; margin-bottom: 24px; }
.search { width: 280px; height: 34px; padding: 0 12px; border: 1px solid var(--obs-border); border-radius: 4px; background: var(--obs-surface); font-size: 13.5px; }
.tabs { display: flex; gap: 4px; }
.tabs button { height: 32px; padding: 0 12px; border-radius: 4px; color: var(--obs-text-muted); font-size: 13px; }
.tabs button:hover { color: var(--obs-ink); }
.tabs button.on { background: var(--obs-focus-soft); color: var(--obs-primary); font-weight: 600; }
.grid3 { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
.spcard { display: flex; flex-direction: column; gap: 14px; padding: 20px; border: 1px solid var(--obs-border); border-radius: 4px; }
.spcard:hover { border-color: var(--obs-text-faint); }
.spcard .top { display: flex; align-items: center; gap: 12px; }
.spcard .top > div { flex: 1; min-width: 0; }
.spcard .top b { display: block; font-weight: 600; color: var(--obs-ink); font-size: 14.5px; }
.spcard .top small { color: var(--obs-text-muted); font-size: 12.5px; }
.spcard p { flex: 1; line-height: 1.55; }
.spcard footer { display: flex; align-items: center; gap: 12px; font-size: 12.5px; color: var(--obs-text-muted); }
.added-tag { font-size: 11.5px; color: var(--obs-primary); border: 1px solid currentColor; border-radius: 3px; padding: 0 6px; line-height: 18px; }

/* ------------------------------------------------------ specialist page */
.sp-layout { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 56px; align-items: start; }
.brief { font-size: 15px; line-height: 1.7; max-width: 62ch; }
.side-stack { display: flex; flex-direction: column; gap: 16px; }
.side-stack .fine { padding: 0 4px; }
.drawer { margin: -8px 0 32px; padding: 16px 20px; border: 1px solid var(--obs-border); border-radius: 4px; background: var(--obs-surface-subtle); }

/* ---------------------------------------------------------------- inbox */
.card { padding: 20px; border: 1px solid var(--obs-border); border-radius: 4px; margin-bottom: 12px; }
.cardhead { display: flex; align-items: center; gap: 12px; }
.cardhead b { display: block; font-weight: 600; color: var(--obs-ink); }
.cardhead small { color: var(--obs-text-muted); font-size: 12.5px; }
.card blockquote { margin-top: 14px; padding-left: 14px; border-left: 2px solid var(--obs-border); line-height: 1.6; }
.card blockquote b { color: var(--obs-ink); font-weight: 600; }
.cardacts { display: flex; align-items: center; gap: 8px; margin-top: 16px; font-size: 13px; }

/* --------------------------------------------------------------- thread */
.thread { max-width: 880px; }
.msg { display: flex; gap: 14px; padding: 24px 0; border-bottom: 1px solid var(--obs-grid); }
.msg:first-child { padding-top: 0; }
.msg .mbody { flex: 1; min-width: 0; }
.msg .mbody > header { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
.msg .mbody > header b { font-weight: 600; color: var(--obs-ink); }
.msg .mbody > header time { color: var(--obs-text-faint); font-size: 12px; }
.txt { line-height: 1.6; }
.txt p + p { margin-top: 10px; }
.ask { display: flex; gap: 8px; margin-top: 28px; }
.ask input { flex: 1; height: 38px; padding: 0 12px; border: 1px solid var(--obs-border); border-radius: 4px; background: var(--obs-surface); font-size: 14px; }
.ask .btn { height: 38px; }

/* ---------------------------------------------------------------- files */
.files { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; align-items: start; }
.filetree .dir { padding: 16px 10px 4px; font-size: 12px; color: var(--obs-text-muted); }
.filetree .dir:first-child { padding-top: 0; }
.filetree button { display: block; width: 100%; text-align: left; padding: 5px 10px; border-radius: 4px; font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 12px; }
.filetree button:hover { background: var(--obs-surface-subtle); }
.filetree button.on { background: var(--obs-focus-soft); color: var(--obs-primary); }
.files pre { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 12.5px; line-height: 1.7; white-space: pre-wrap; word-break: break-word; }

/* ------------------------------------------------------ audit, settings */
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.tile { padding: 16px 20px; border: 1px solid var(--obs-border); border-radius: 4px; }
.tile small { display: block; font-size: 12.5px; color: var(--obs-text-muted); }
.tile b { display: block; margin-top: 4px; font-size: 26px; font-weight: 600; color: var(--obs-ink); font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile span { font-size: 12px; color: var(--obs-text-muted); }
.kv { display: grid; grid-template-columns: 180px 1fr; gap: 14px 24px; font-size: 13.5px; }
.kv dt { color: var(--obs-text-muted); }
.kv dd { color: var(--obs-ink); display: flex; align-items: center; gap: 10px; }
.kv input { height: 30px; padding: 0 10px; border: 1px solid var(--obs-border); border-radius: 4px; background: var(--obs-surface); }
.switch { display: inline-flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--obs-text-muted); cursor: pointer; flex-shrink: 0; }
.switch i { position: relative; display: inline-block; width: 30px; height: 18px; border: 1px solid var(--obs-border); border-radius: 9px; background: var(--obs-surface-subtle); }
.switch i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--obs-text-faint); transition: left .12s; }
.switch.on i { border-color: var(--obs-primary); background: var(--obs-primary); }
.switch.on i::after { left: 15px; background: #fff; }
.switch.locked { cursor: default; }

/* ------------------------------------------------------ search, toast */
.overlay { position: fixed; inset: 0; z-index: 100; display: none; align-items: flex-start; justify-content: center; padding-top: 14vh; background: rgba(15, 23, 42, .35); }
.overlay.show { display: flex; }
.palette { width: 560px; max-width: calc(100vw - 32px); background: var(--obs-surface); border: 1px solid var(--obs-border); border-radius: 4px; }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--obs-border); padding: 14px 16px; font-size: 15px; background: transparent; }
.palette input:focus { outline: none; }
.palette .res { max-height: 50vh; overflow-y: auto; padding: 4px 0; }
.palette .res button { display: flex; align-items: center; gap: 12px; width: 100%; padding: 9px 16px; text-align: left; }
.palette .res button:hover { background: var(--obs-surface-subtle); }
.palette .res .k { width: 72px; flex-shrink: 0; font-size: 12px; color: var(--obs-text-muted); }
.palette .res small { margin-left: auto; font-size: 12px; color: var(--obs-text-muted); }
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 200;
  padding: 10px 16px; border-radius: 4px; background: var(--obs-ink); color: var(--obs-surface); font-size: 13px;
  opacity: 0; transition: opacity .15s; pointer-events: none;
}
.toast.show { opacity: 1; }

/* ----------------------------------------------------------- responsive */
@media (max-width: 1180px) {
  .desk { grid-template-columns: 1fr; }
  .feed { height: auto; min-height: 0; }
  .sp-layout { grid-template-columns: 1fr; gap: 40px; }
}
@media (max-width: 760px) {
  body { height: auto; overflow: auto; }
  .shell { grid-template-columns: 1fr; height: auto; min-height: 100vh; }
  .nav { flex-direction: row; align-items: center; gap: 4px; padding: 8px 12px; border-right: 0; border-bottom: 1px solid var(--obs-border); overflow-x: auto; }
  .brand { padding: 0 8px 0 0; }
  .brand > div, .navsec, .navlist.mine, .navfoot > span { display: none; }
  .navlist { flex-direction: row; }
  .navitem { width: auto; }
  .navitem > span:not(.mini) { display: none; }
  .navfoot { margin: 0 0 0 auto; padding: 0; border: 0; }
  .main { height: auto; }
  .content { overflow: visible; }
  .topbar { padding: 0 16px; }
  .searchbtn { width: auto; }
  .searchbtn span, .searchbtn kbd { display: none; }
  .page { padding: 24px 16px 56px; }
  .pagehead { flex-wrap: wrap; }
  .toolbar { flex-wrap: wrap; }
  .search { width: 100%; }
  .grid3 { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: 1fr 1fr; }
  .files { grid-template-columns: 1fr; }
  .kv { grid-template-columns: 1fr; gap: 2px; }
  .kv dt { margin-top: 12px; }
  .node { flex-wrap: wrap; }
  .node .who small { display: none; }
  .node .st { width: 100%; text-align: left; padding-left: 44px; }
  .node .st span { justify-content: flex-start; }
  .node .st small { display: none; }
}

  const MINUS = '−';

  const MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  function yen(v, d) {
    if (v == null) return DASH;

    if (v >= 1e12) s = '¥' + (v / 1e12).toFixed(d == null ? 2 : d) + 'tn';
    else if (v >= 1e8) s = '¥' + (v / 1e9).toFixed(d == null ? 1 : d) + 'bn';
    else if (v >= 1e6) s = '¥' + (v / 1e6).toFixed(0) + 'm';

  const n = v => v == null ? DASH : Math.round(v).toLocaleString('en');

  function dmy(iso) { if (!iso) return DASH; const d = new Date(iso + 'T00:00:00'); return d.getDate() + ' ' + MON[d.getMonth()] + (d.getFullYear() !== 2026 ? ' ' + d.getFullYear() : ''); }
  const monthName = iso => { const d = new Date(iso + 'T00:00:00'); return MONTH[d.getMonth()] + ' ' + d.getFullYear(); };
  function when(ts) { const [d, t] = ts.split(' '); return d === TODAY ? (t || 'Today') : dmy(d); }

      const cut = hs.filter(h => h.prior_shares != null && h.shares != null && h.shares < h.prior_shares).length;
      html = `<p>Companies that hold <b>${esc(CO[code].short)}</b> as a cross-shareholding, largest first.</p>` +
        table([['Holder'], ['Shares', 1], ['Change', 1], ['Value', 1], ['Reason given']], hs.map(h => `<tr><td>${esc(shortName(h.holder_name_en || h.holder_name, h.holder_sec_code))}</td><td class="right">${n(h.shares)}</td><td class="right">${h.shares != null && h.prior_shares != null ? signed(h.shares - h.prior_shares) : DASH}</td><td class="right">${yen(h.book_value_yen)}</td><td class="reason" title="${esc(h.purpose_ja || '')}">${esc(trim(h.purpose_ja, 22)) || DASH}</td></tr>`)) +
        `<p>${cut ? cut + ' of the ' + hs.length + ' cut their stake this year.' : 'None of the ' + hs.length + ' cut their stake this year.'}</p>`;
      tags.push(FILED);
    }
    else if (/(buyback|repurchase|window|bought|unspent|running)/.test(t)) {
      const list = code ? [code] : S.coverage;
      call('my_coverage', ''); list.forEach(c => call('get_company', 'code=' + c + ' dataset=buybacks'));
      const ps = []; list.forEach(c => programmes(c).forEach(p => ps.push(Object.assign({ code: c }, p))));
      const live = (code ? ps : ps.filter(p => p.lifecycle !== 'completed')).sort((a, b) => a.resolution_date < b.resolution_date ? 1 : -1);
      html = `<p>${code ? esc(CO[code].short) + '’s buyback programmes.' : 'Buybacks on your names that are running or closed without completing.'}</p>` +
        table([['Company'], ['Window'], ['Authorised', 1], ['Bought', 1], ['Done', 1], ['Status']], live.map(p => `<tr><td>${esc(coName(p.code))}</td><td class="nowrap">${dmy(p.window_start)} – ${dmy(p.window_end)}</td><td class="right">${yen(p.authorised_yen)}</td><td class="right">${yen(p.cumulative_yen)}</td><td class="right">${pct(p.completion_pct)}</td><td>${LIFE[p.lifecycle] || p.lifecycle}</td></tr>`));
      const un = live.filter(p => p.lifecycle === 'expired_unspent');
      if (un.length) html += un.map(p => `<p><b>${esc(coName(p.code))}</b> closed its window on ${dmy(p.window_end)} with ${yen(p.unspent_yen)} unspent.</p>`).join('');
      tags.push(FILED, ['calc', 'done = cumulative yen acquired ÷ yen authorised × 100. Left blank where the filing states one figure and not the other.']);
    }
    else if (/(cpi|inflation|price|macro|core|print|annuali[sz]ed|line)/.test(t)) {
      call('get_overview', 'dataset=cpi-jp'); call('get_series', 'dataset=cpi-jp series=0001,0161,0165 measure=yoy');
      const h = cpiTile('headline_yoy'), c = cpiTile('core_yoy'), cc = cpiTile('corecore_yoy'), m = cpiTile('headline_mom'), a3 = cpiTile('headline_ann3m');
      const rel = DATA.cpi.release;
      const row = (label, code, tile) => `<tr><td>${label}</td><td class="right">${cpiIndex(code) == null ? DASH : cpiIndex(code).toFixed(1)}</td><td class="right">${pct(tile.value)}</td><td class="right">${pct(tile.value - tile.delta_pp)}</td></tr>`;
      html = `<p><b>${monthName(rel.latest_period)} CPI</b>, national, 2025 = 100.</p>` +
        table([['Measure'], ['Index', 1], ['Year on year', 1], ['Prior month', 1]], [row('All items', '0001', h), row('Less fresh food', '0161', c), row('Less fresh food and energy', '0165', cc)]) +
        `<p>Month on month ${pct(m.value)}; three-month annualised ${pct(a3.value)}. Core is ${c.value >= 1.5 ? 'above' : 'below'} your 1.5% line by ${pp(c.value - 1.5)}.</p>`;
      tags.push(['official', 'Index · official statistic'], ['src', 'e-Stat ' + rel.source_id.split(':')[1]], ['calc', 'year on year = (index[t] ÷ index[t−12] − 1) × 100, from the published index. Three-month annualised = ((index[t] ÷ index[t−3])^4 − 1) × 100. A rate from rounded indices can differ from the Bureau’s by ±0.1 pp.']);
    }
    else if (/(purpose|reason|why)/.test(t) && code) {
      call('get_company', 'code=' + code + ' dataset=cross-shareholdings');
      const hs = (CO[code].holdings || []).filter(h => h.shares).slice(0, 8);
      html = `<p>Why <b>${esc(CO[code].short)}</b> says it keeps its largest holdings, in its own words.</p>` +
        table([['Holding'], ['Value', 1], ['Reason given']], hs.map(h => `<tr><td>${esc(shortName(h.held_name_en || h.held_name_raw, h.held_sec_code))}</td><td class="right">${yen(h.book_value_yen)}</td><td class="reason" title="${esc(h.purpose_ja || '')}">${esc(trim(h.purpose_ja, 34)) || DASH}</td></tr>`));
      tags.push(FILED, ['src', 'EDINET ' + CO[code].filing.doc_id]);
    }
    else if (/(changed|last night|moved|new filing)/.test(t)) {
      call('my_coverage', ''); S.coverage.forEach(c => call('get_vintages', 'code=' + c));
      html = `<p>No new filings since the last run at 04:03. The latest annual reports on file:</p>` +
        table([['Company'], ['Year end'], ['Report']], S.coverage.map(c => `<tr><td>${esc(CO[c].short)}</td><td>${dmy(CO[c].filing.period_end)} 2026</td><td><span class="code">${CO[c].filing.doc_id}</span></td></tr>`));
      tags.push(FILED);
    }
    else {
      const sp = SPX[spId] || SPX['coverage-monitor'];
      html = `<p>This prototype answers a set list of questions. Try: ${sp.tries.map(x => '“' + esc(x) + '”').join(' or ')}.</p>`;
    }
    return { html, trail, tags };
  }

  /* ----------------------------------------------------------------- seed */
  function seed(s) {

    const miz = programmes('8411').find(p => p.lifecycle === 'running'); const toy = programmes('7203')[0];

    s.threads = {

        msgs: mk('cross-shareholding', '2026-06-30 11:04', 'Why does MS&AD keep its largest holdings?') }

  }

  /* -------------------------------------------------------------- render */
  const I = d => `<svg viewBox="0 0 24 24">${d}</svg>`;

  const NAV = [['inbox', 'Inbox'], ['desk', 'Desk'], ['specialists', 'Specialists'], ['research', 'Research'], ['files', 'Files'], ['audit', 'Audit'], ['settings', 'Settings']];

  function route() { const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean); return { sec: parts[0] || 'desk', id: parts[1] ? decodeURIComponent(parts[1]) : null, sub: parts[2] || null }; }

  const pageHead = (title, sub, actions) => `<div class="pagehead"><div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ''}</div>${actions ? `<div class="actions">${actions}</div>` : ''}</div>`;
  const wrapTables = h => h.replace(/<table/g, '<div class="tw"><table').replace(/<\/table>/g, '</table></div>');

  // one quiet line under any answer: trust badge, source, and two reveals
  function provHtml(tags, trail, id) {
    const parts = []; let formula = null;
    (tags || []).forEach(t => {
      if (t[0] === 'official') parts.push(`<span class="badge official">${esc(t[1])}</span>`);
      else if (t[0] === 'src') parts.push(`<span>${esc(t[1])}</span>`);
      else if (t[0] === 'calc') formula = t[1];
    });
    if (formula) parts.push(`<button class="linkbtn toggle" data-t="f-${id}">Show calculation</button>`);
    if (trail && trail.length) parts.push(`<button class="linkbtn toggle" data-t="t-${id}">${trail.length} tool call${trail.length > 1 ? 's' : ''}</button>`);

    return `<div class="prov">${parts.join('')}</div>` +

  /* ---- Desk */

  /* ---- Specialist page */
  function sha(s) { let h = 0x811c9dc5; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619) >>> 0; } return h.toString(16).padStart(8, '0').slice(0, 7); }

        <section class="panel"><header>Threads<small>${threads.length}</small><span class="grow"></span><button class="linkbtn" data-new-thread="${s.id}">${ICONS.plus}New</button></header>${threads.length ? `<ul class="linklist">${threads.map(t => `<li><button data-go="research/${t.id}"><b>${esc(t.title)}</b><small>${when(t.updated)}</small></button></li>`).join('')}</ul>` : '<p class="empty">No threads yet.</p>'}</section>
        <section class="panel"><header>Files</header><ul class="linklist mono">${files.map(f => `<li><button data-go="files/${s.id}/${encodeURIComponent(f)}">${f}</button></li>`).join('')}</ul></section>
        <p class="fine">Version ${ver(s.id)} · ${sha(s.id + ver(s.id))} · ${s.tools.length} tools via the Observatory</p>
      </aside></div></div></div>`;
  }

  /* ---- Inbox */
  function vInbox() {
    const items = S.feed.filter(p => p.approval);
    const open = items.filter(p => !S.approvals[p.approval]); const done = items.filter(p => S.approvals[p.approval]);
    const card = p => {
      const st = S.approvals[p.approval]; const sp = SPX[p.who];
      return `<article class="card"><header class="cardhead"><span class="av">${sp.ini}</span><div><b>${sp.name}</b><small>Wants to post to ${esc(S.slack)} · ${when(p.ts)}</small></div></header>
        <blockquote>${p.text}</blockquote>${provHtml(p.tags, p.trail, 'ib' + p.id)}
        <div class="cardacts">${st ? `<span class="${st === 'approved' ? 'ok' : 'muted'}">${st === 'approved' ? 'Approved and posted' : 'Declined. Nothing was sent.'}</span>` : `<button class="btn primary" data-approve="${p.approval}">Approve and post</button><button class="btn" data-decline="${p.approval}">Decline</button>`}</div></article>`;
    };
    const runs = [['macro-brief', TODAY + ' 06:40', 'CPI note posted to #desk'], ['buyback-monitor', TODAY + ' 04:12', 'Two monthly reports read'], ['coverage-monitor', TODAY + ' 04:03', S.coverage.length + ' names read, no changes']];
    return topbar([['Inbox']]) + `<div class="content"><div class="page narrow">${pageHead('Inbox', open.length ? `${open.length} waiting for your approval.` : 'Nothing is waiting on you.')}
      ${open.length ? `<h3 class="sec">Waiting on you</h3>${open.map(card).join('')}` : ''}
      <h3 class="sec">Recent runs</h3>
      <ul class="rows">${runs.map(x => `<li><span class="av sm">${SPX[x[0]].ini}</span><div><b>${SPX[x[0]].name}</b><small>${esc(x[2])}</small></div><time class="muted small">${when(x[1])}</time></li>`).join('')}</ul>
      ${done.length ? `<h3 class="sec">Decided</h3>${done.map(card).join('')}` : ''}</div></div>`;
  }

  /* ---- Research */
  function vResearch() {
    const def = isAdded('cross-shareholding') ? 'cross-shareholding' : 'macro-brief';
    return topbar([['Research']]) + `<div class="content"><div class="page narrow">${pageHead('Research', 'Conversations with your specialists. Every answer shows its sources.', `<button class="btn" data-new-thread="${def}">${ICONS.plus} New thread</button>`)}
      <ul class="rows">${S.threadOrder.map(id => { const t = S.threads[id]; return `<li data-go="research/${id}"><span class="av sm">${SPX[t.sp].ini}</span><div><b>${esc(t.title)}</b><small>${SPX[t.sp].name}</small></div><time class="muted small">${when(t.updated)}</time></li>`; }).join('')}</ul></div></div>`;
  }
  function vThread(r) {
    const t = S.threads[r.id]; if (!t) return vResearch(); const sp = SPX[t.sp];
    const msgs = t.msgs.map((m, i) => m.who === 'me'
      ? `<div class="msg"><span class="av me">A</span><div class="mbody"><header><b>You</b><time>${when(m.ts)}</time></header><div class="txt">${m.html}</div></div></div>`
      : `<div class="msg"><span class="av">${sp.ini}</span><div class="mbody"><header><b>${sp.name}</b><time>${when(m.ts)}</time></header><div class="txt">${wrapTables(m.html)}</div>${provHtml(m.tags, m.trail, t.id + '-' + i)}</div></div>`).join('');
    return topbar([['Research', 'research'], [t.title]], `<button class="btn sm" id="pin">Pin</button>`) + `<div class="content"><div class="page"><div class="thread">${pageHead(esc(t.title), 'With ' + sp.name + '. It only reads; nothing is sent without your approval.')}
      ${msgs}
      <div class="ask"><input id="ask" placeholder="Ask ${sp.name}"><button class="btn primary" id="ask-send">Ask</button></div>
      <div class="chips" style="margin-top:12px">${sp.tries.map(x => `<button class="chip" data-ask="${esc(x)}" data-sp="${sp.id}" data-thread="${t.id}">${esc(x)}</button>`).join('')}</div></div></div></div>`;
  }

  /* ---- Files */
  function fileContent(spId, path) {
    const s = SPX[spId];
    if (path === 'brief.md') return `# ${s.name}\nversion: ${ver(spId)}\n\n${s.brief}\n\n## Tools\n${s.tools.map(x => '- ' + x).join('\n')}\n\n## Schedule\n${s.schedule}\n\n## Delivery\n${s.delivery}`;
    if (path === 'coverage.json') return JSON.stringify({ owner: '[YOUR NAME]', updated: TODAY, names: S.coverage.map(c => ({ code: c, name: CO[c].name_en, latest_report: CO[c].filing.doc_id })) }, null, 2);
    if (path === 'rules/exit-threshold.yaml') return `# Rules checked on every run.\n# A rule can only read; anything outward waits for approval.\nrules:\n  - id: exit\n    when: holding.shares == 0 and holding.prior_shares > 0\n    post: "#desk"\n  - id: sharp-cut\n    when: holding.shares < 0.5 * holding.prior_shares\n    post: "#desk"\n  - id: unspent-window\n    when: programme.lifecycle == "expired_unspent"\n    post: "${S.slack}"   # outward: approval first\n  - id: core-cpi-line\n    when: cpi.core_yoy >= 1.5\n    post: "#desk"\n`;
    if (path.startsWith('runs/')) return `${TODAY} 04:03:11  run start   ${HANDLE(spId)} v${ver(spId)}\n` + S.coverage.map(c => `${TODAY} 04:03:12  get_company code=${c}  ${CO[c].filing.doc_id} unchanged`).join('\n') + `\n${TODAY} 04:03:14  run end     ok, 0 events`;
    return '';
  }
  function vFiles(r) {
    const spId = r.id && SPX[r.id] ? r.id : S.added[0]; const path = r.sub ? decodeURIComponent(r.sub) : 'brief.md';
    const names = ['brief.md', 'coverage.json', 'rules/exit-threshold.yaml', 'runs/' + TODAY + '.log'];
    const tree = S.added.map(id => `<div class="dir">${id}/</div>${names.map(f => `<button class="${id === spId && f === path ? 'on' : ''}" data-go="files/${id}/${encodeURIComponent(f)}">${f}</button>`).join('')}`).join('');
    return topbar([['Files'], [SPX[spId].name], [path]]) + `<div class="content"><div class="page wide">${pageHead('Files', 'Everything a specialist writes is a file you can read.')}
      <div class="files"><nav class="filetree">${tree}</nav><section class="panel"><header>${esc(spId + '/' + path)}<span class="grow"></span><small>Read-only</small></header><div class="body"><pre>${esc(fileContent(spId, path))}</pre></div></section></div></div></div>`;
  }

  /* ---- Audit */
  function vAudit() {
    const calls = {}; let total = 0;
    const add = (fn, who) => { calls[fn] = calls[fn] || { n: 0, who: new Set() }; calls[fn].n++; calls[fn].who.add(who); total++; };
    S.feed.forEach(p => (p.trail || []).forEach(c => add(c.fn, p.who)));
    S.threadOrder.forEach(id => S.threads[id].msgs.forEach(m => (m.trail || []).forEach(c => add(c.fn, S.threads[id].sp))));
    const rows = Object.entries(calls).sort((a, b) => b[1].n - a[1].n);
    const sent = Object.values(S.approvals).filter(v => v === 'approved').length;
    const tile = (k, v, s) => `<div class="tile"><small>${k}</small><b>${v}</b><span>${s}</span></div>`;
    return topbar([['Audit']]) + `<div class="content"><div class="page">${pageHead('Audit', 'Every tool call your specialists made. They have no other way to reach a number.')}
      <div class="tiles">${tile('Tool calls', n(total), 'since 2 Jun')}${tile('Runs', n(3 + S.threadOrder.length), 'scheduled and on request')}${tile('Waiting', n(pendingApprovals().length), 'for your approval')}${tile('Sent outward', n(sent), 'all approved by you')}</div>
      <h3 class="sec">Tools</h3><div class="panel">${table([['Tool'], ['Used by'], ['Calls', 1]], rows.map(([fn, v]) => `<tr><td><span class="code" title="${esc(TOOLS[fn] || '')}">${fn}</span></td><td>${[...v.who].map(w => SPX[w] ? SPX[w].name : w).join(', ')}</td><td class="right">${n(v.n)}</td></tr>`))}</div>
      <h3 class="sec">Recent runs</h3><div class="panel">${table([['When'], ['Specialist'], ['Trigger'], ['Calls', 1], ['Result']], [
        `<tr><td class="nowrap">Today 06:40</td><td>Macro Release Brief</td><td>CPI release</td><td class="right">2</td><td>Posted to #desk</td></tr>`,
        `<tr><td class="nowrap">Today 04:12</td><td>Buyback Monitor</td><td>Monthly reports</td><td class="right">2</td><td>Posted to #desk</td></tr>`,
        `<tr><td class="nowrap">Today 04:03</td><td>Coverage Monitor</td><td>Nightly</td><td class="right">${S.coverage.length + 1}</td><td>No changes</td></tr>`,
        `<tr><td class="nowrap">13 Jul 06:05</td><td>Buyback Monitor</td><td>Window closed</td><td class="right">2</td><td>Asked for approval</td></tr>`])}</div>
      <h3 class="sec">Connections</h3><div class="panel">${table([['Service'], ['Credentials'], ['Status']], [
        `<tr><td>Plover Analytics</td><td>Your Observatory key, ending 4f2a</td><td class="ok">Connected</td></tr>`,
        `<tr><td>Slack ${esc(S.slack)}</td><td>Webhook you supplied</td><td class="ok">Connected</td></tr>`,
        `<tr><td>Your firm’s research</td><td>Never stored here</td><td class="muted">Not added</td></tr>`])}</div></div></div>`;
  }

  /* ---- Settings */
  function vSettings() {
    const P = S.policy;
    const sw = (k, on) => `<label class="switch ${on ? 'on' : ''}" data-policy="${k}"><i></i>${on ? 'On' : 'Off'}</label>`;
    const rules = [['Read data', 'Specialists may call any read tool without asking.', sw('read', P.read)], ['Write to own files', 'Rules, logs and exports inside the specialist’s folder.', sw('workspace', P.workspace)], ['Anything outward', 'Slack posts, emails and shared notes wait for you.', sw('outward', P.outward)], ['Placing orders', 'Not possible. No specialist has a trading tool.', '<span class="switch locked"><i></i>Never</span>']];
    return topbar([['Settings']]) + `<div class="content"><div class="page narrow">${pageHead('Settings', 'Specialists run on your own model key. Plover Analytics never hosts a model.')}
      <h3 class="sec">Keys</h3><div class="panel"><dl class="kv body"><dt>Model key</dt><dd><span class="mono">sk-ant-•••• 4f2a</span><button class="linkbtn">Replace</button></dd><dt>Observatory key</dt><dd><span class="mono">plv_•••• 9c1e</span><button class="linkbtn">Rotate</button></dd><dt>Default model</dt><dd>claude-sonnet-5</dd></dl></div>
      <h3 class="sec">Approval policy</h3><ul class="rows">${rules.map(x => `<li><div><b>${x[0]}</b><small>${x[1]}</small></div>${x[2]}</li>`).join('')}</ul>
      <h3 class="sec">Delivery</h3><div class="panel"><dl class="kv body"><dt>Slack channel</dt><dd><input id="slack" class="mono" value="${esc(S.slack)}"></dd><dt>Email digest</dt><dd>Daily at 07:00 JST</dd></dl></div>
      <p class="fine" style="margin-top:40px">Prototype. Figures are a snapshot of the Plover Analytics API from ${dmy(TODAY)}; replies are computed from it and no model is called. <button class="linkbtn warn" id="reset">Reset demo</button></p></div></div>`;
  }

  /* ----------------------------------------------------------- behaviour */
  function addThread(spId, title, q) {
    const id = 't' + Date.now(); const a = answer(q, spId); const ts = nowStamp();
    S.threads[id] = { id, title, sp: spId, updated: ts, msgs: [{ who: 'me', ts, html: '<p>' + esc(q) + '</p>' }, { who: spId, ts, html: a.html, trail: a.trail, tags: a.tags }] };
    S.threadOrder.unshift(id); return id;
  }
  function askInThread(t, q) {
    const a = answer(q, t.sp); const ts = nowStamp();
    t.msgs.push({ who: 'me', ts, html: '<p>' + esc(q) + '</p>' }, { who: t.sp, ts, html: a.html, trail: a.trail, tags: a.tags }); t.updated = ts;
    render(); const c = $('#main .content'); if (c) c.scrollTop = 1e6;
  }
  function bind(r) {
    $$('[data-go]').forEach(b => b.onclick = e => { e.preventDefault(); go(b.dataset.go); });
    $$('[data-tab]').forEach(b => b.onclick = () => { S.catTab = b.dataset.tab; render(); });
    const q = $('#cat-q'); if (q) q.oninput = () => { S.catQ = q.value; const pos = q.selectionStart; render(); const q2 = $('#cat-q'); q2.focus(); q2.setSelectionRange(pos, pos); };
    $$('[data-add]').forEach(b => b.onclick = () => {
      const id = b.dataset.add;
      if (!isAdded(id)) { S.added.push(id); S.feed.push({ id: 'f' + Date.now(), who: 'system', ts: nowStamp(), text: `${SPX[id].name} joined the desk` }); toast(SPX[id].name + ' added to your desk'); }
      render();
    });
    $$('[data-update]').forEach(b => b.onclick = () => { const id = b.dataset.update; S.versions[id] = SPX[id].update; toast(SPX[id].name + ' updated to v' + SPX[id].update); render(); });
    const ua = $('#update-all'); if (ua) ua.onclick = () => { S.added.forEach(id => { if (SPX[id].update) S.versions[id] = SPX[id].update; }); toast('All specialists are up to date'); render(); };
    $$('[data-approve]').forEach(b => b.onclick = () => { S.approvals[b.dataset.approve] = 'approved'; toast('Posted to ' + S.slack); render(); });
    $$('[data-decline]').forEach(b => b.onclick = () => { S.approvals[b.dataset.decline] = 'declined'; toast('Declined. Nothing was sent.'); render(); });
    $$('.toggle').forEach(b => b.onclick = () => { const el = document.getElementById(b.dataset.t); if (el) el.classList.toggle('hidden'); });
    $$('[data-ask]').forEach(b => b.onclick = () => {
      if (b.dataset.thread) askInThread(S.threads[b.dataset.thread], b.dataset.ask);
      else { const id = addThread(b.dataset.sp, trim(b.dataset.ask.replace(/[?.]$/, ''), 44), b.dataset.ask); go('research/' + id); }
    });
    $$('[data-new-thread]').forEach(b => b.onclick = () => { const s = SPX[b.dataset.newThread]; const id = addThread(s.id, trim(s.tries[0].replace(/[?.]$/, ''), 44), s.tries[0]); go('research/' + id); });
    const ask = $('#ask'); if (ask) { const send = () => { const v = ask.value.trim(); if (v) askInThread(S.threads[r.id], v); }; $('#ask-send').onclick = send; ask.onkeydown = e => { if (e.key === 'Enter') send(); }; }
    const pin = $('#pin'); if (pin) pin.onclick = () => toast('Pinned (not saved in this prototype)');
    const ss = $('#sp-settings'); if (ss) ss.onclick = () => { S.settingsOpen = S.settingsOpen === r.id ? null : r.id; render(); };
    const c = $('#compose');
    if (c) {
      const send = () => {
        const v = c.value.trim(); if (!v) return;
        const m = v.match(/@([a-z-]+)/); const spId = m && SPX[m[1]] && isAdded(m[1]) ? m[1] : null;
        const post = { id: 'f' + Date.now(), who: 'me', ts: nowStamp(), text: v };
        S.feed.push(post);
        if (spId) { const a = answer(v.replace(/@[a-z-]+/, ''), spId); S.feed.push({ id: 'f' + (Date.now() + 1), who: spId, ts: nowStamp(), text: a.html, tags: a.tags, trail: a.trail }); }
        else post.reply = 'No specialist mentioned. Type @ to bring one in.';
        render();
      };
      $('#send').onclick = send;
      c.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } if (e.key === '@') $('#mentions').classList.remove('hidden'); if (e.key === 'Escape') $('#mentions').classList.add('hidden'); };
      $('#m-at').onclick = () => $('#mentions').classList.toggle('hidden');
      $$('#mentions button').forEach(b => b.onclick = () => { c.value = c.value.replace(/@[a-z-]*$/, '') + (c.value && !/[@\s]$/.test(c.value) ? ' ' : '') + HANDLE(b.dataset.m) + ' '; $('#mentions').classList.add('hidden'); c.focus(); });
      const p = $('#posts'); if (p) p.scrollTop = 1e6;
    }
    $$('[data-policy]').forEach(l => l.onclick = () => { S.policy[l.dataset.policy] = !S.policy[l.dataset.policy]; render(); });
    const sl = $('#slack'); if (sl) sl.onchange = () => { S.slack = sl.value.trim() || '#japan-desk'; render(); toast('Delivery channel saved'); };
    const rs = $('#reset'); if (rs) rs.onclick = () => { try { localStorage.removeItem(STORE); } catch (e) { } S = DEFAULT(); seed(S); go('desk'); render(); toast('Demo reset'); };
    $('#theme').onclick = () => { S.theme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark'; render(); };
    $('#open-search').onclick = openSearch;
  }

  /* ---- search palette */
  function openSearch() { $('#overlay').classList.add('show'); const i = $('#pal-q'); i.value = ''; i.focus(); searchResults(''); }
  function closeSearch() { $('#overlay').classList.remove('show'); }
  function searchResults(q) {
    q = q.toLowerCase(); const out = [];
    SP.forEach(s => { if (!q || (s.name + s.desc).toLowerCase().includes(q)) out.push(['Specialist', s.name, isAdded(s.id) ? 'On your desk' : '', 'specialists/' + s.id]); });
    Object.values(CO).forEach(c => { if (!q || (c.short + c.name_en + c.code).toLowerCase().includes(q)) out.push(['Company', c.short, c.code + (S.coverage.includes(c.code) ? ' · covered' : ''), 'company:' + c.code]); });
    S.threadOrder.forEach(id => { const t = S.threads[id]; if (!q || t.title.toLowerCase().includes(q)) out.push(['Thread', t.title, SPX[t.sp].name, 'research/' + id]); });
    NAV.forEach(s => { if (q && s[1].toLowerCase().includes(q)) out.push(['Page', s[1], '', s[0]]); });
    $('#pal-res').innerHTML = out.slice(0, 12).map(o => `<button data-pal="${o[3]}"><span class="k">${o[0]}</span>${esc(o[1])}<small>${esc(o[2])}</small></button>`).join('') || '<p class="empty">Nothing matches.</p>';
    $$('[data-pal]').forEach(b => b.onclick = () => {
      closeSearch(); const p = b.dataset.pal;
      if (p.startsWith('company:')) { const code = p.split(':')[1]; const id = addThread('cross-shareholding', CO[code].short + ' holders', 'Who still holds ' + CO[code].short + ' (' + code + '), and why?'); go('research/' + id); }
      else go(p);
    });
  }

  /* ---------------------------------------------------------------- boot */
  S = load();
  const ROOT = document.createElement('div'); ROOT.id = 'app'; document.body.appendChild(ROOT);
  ROOT.innerHTML = `<div class="shell"><aside class="nav" id="nav"></aside><div class="main" id="main"></div></div>
    <div class="overlay" id="overlay"><div class="palette"><input id="pal-q" placeholder="Search specialists, companies, threads"><div class="res" id="pal-res"></div></div></div><div class="toast" id="toast"></div>`;
  $('#overlay').onclick = e => { if (e.target === $('#overlay')) closeSearch(); };
  $('#pal-q').oninput = e => searchResults(e.target.value);
  document.addEventListener('keydown', e => { if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openSearch(); } if (e.key === 'Escape') closeSearch(); });
  window.addEventListener('hashchange', render);
  if (!location.hash) location.hash = '#/desk';
  render();
})();

</script>
</body>
</html>
