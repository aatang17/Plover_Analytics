<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Company Profile · Plover Analytics</title>
<link rel="stylesheet" href="assets/tokens.css">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>

<header class="site-header" data-section="equities" data-page="company"></header>
<script src="assets/nav.js"></script>

<main class="container">
  <div class="page-tabs" data-page-tabs></div>
  <div id="stale-banner"></div>

  <!-- The way in, and the way to switch: above the company, never inside its
       header, so the card below is about one company and nothing else. -->
  <div class="co-find">
    <div class="search-rail">
      <div class="search-field">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"
             class="search-icon"><circle cx="7" cy="7" r="4.6"></circle><path d="M10.4 10.4 14 14"></path></svg>
        <input type="search" id="q" autocomplete="off"
               placeholder="Company name in English or Japanese, or securities code. E.g. Toyota, トヨタ, 7203"
               aria-label="Find a company" role="combobox" aria-expanded="false" aria-controls="results">
      </div>
    </div>
    <ul class="co-results" id="results" role="listbox" hidden></ul>
  </div>

  <div class="metric-card" id="picker">
    <div class="metric-card-head">
      <h1 id="co-name">Company Profile</h1>
      <span class="metric-asof" id="page-asof"></span>
      <p class="metric-sub" id="page-sub">Everything filed on one company: the documents,
      the statements, the register, the board, the buyback and the property table — each
      figure as filed, with the report it came from.</p>
    </div>
    <div class="co-id" id="identity"></div>
  </div>

  <!-- Everything below is rendered by company.js once a company is chosen. -->
  <div id="profile" hidden>
    <div class="co-holds" id="holds"></div>

    <section aria-labelledby="h-filings">
      <h2 id="h-filings">Filings <span class="h2-note" id="filings-note"></span></h2>
      <div class="table-wrap" id="filings-table"></div>
      <p class="table-foot" id="filings-foot"></p>
    </section>

    <section aria-labelledby="h-fin" id="sec-fin" hidden>
      <h2 id="h-fin">Financials <span class="h2-note" id="fin-note"></span></h2>
      <div class="strip"><div class="strip-grid" id="fin-tiles"></div></div>
      <div class="co-tabs" id="fin-tabs" role="tablist"></div>
      <div id="fin-pane"></div>
      <p class="table-foot" id="fin-foot"></p>
    </section>

    <section aria-labelledby="h-own" id="sec-own" hidden>
      <h2 id="h-own">Ownership <span class="h2-note" id="own-note"></span></h2>
      <div class="strip"><div class="strip-grid" id="own-tiles"></div></div>
      <div class="co-tabs" id="own-tabs" role="tablist"></div>
      <div id="own-pane"></div>
      <p class="table-foot" id="own-foot"></p>
    </section>

    <section aria-labelledby="h-gov" id="sec-gov" hidden>
      <h2 id="h-gov">Governance <span class="h2-note" id="gov-note"></span></h2>
      <div class="strip"><div class="strip-grid" id="gov-tiles"></div></div>
      <div id="gov-body"></div>
      <p class="table-foot" id="gov-foot"></p>
    </section>

    <div class="co-pair">
      <section aria-labelledby="h-cap" id="sec-cap" hidden>
        <h2 id="h-cap">Capital Returns <span class="h2-note" id="cap-note"></span></h2>
        <div class="strip"><div class="strip-grid" id="cap-tiles"></div></div>
        <div id="cap-body"></div>
        <p class="table-foot" id="cap-foot"></p>
      </section>

      <section aria-labelledby="h-ass" id="sec-ass" hidden>
        <h2 id="h-ass">Assets <span class="h2-note" id="ass-note"></span></h2>
        <div id="ass-body"></div>
        <p class="table-foot" id="ass-foot"></p>
      </section>
    </div>

    <p class="co-prov" id="provenance"></p>
  </div>

  <div id="empty" class="co-empty" hidden></div>
</main>

<script src="assets/format.js"></script>
<script src="assets/sortable.js"></script>
<script src="assets/company.js"></script>
</body>
</html>
